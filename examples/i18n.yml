# Example workflow for consumers of this Action.
# Copy this into the repos that should be auto-translated.
name: i18n Autopilot

on:
  pull_request:
    paths:
      - "locales/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: isabellehuecloser-ctrl/i18n-autopilot@v0
        with:
          source-locale: en
          locales-dir: locales
          api-key: ${{ secrets.OPENAI_API_KEY }}
